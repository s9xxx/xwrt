name: 🛠️ X-Wrt kirkwood 全平台（Marvell Kirkwood）

# 每周五 UTC 04:00 自动编译 = 北京时间周五 12:00
# 一个平台一个 yml：本文件只处理 target = kirkwood，自动枚举其下所有 subtarget 的全部机型
# 主题：kiddin9 的 luci-theme-vantage（菜单文字默认展开），去掉 x-wrt 默认主题 bootstrap
on:
  schedule:
    - cron: '0 4 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: '机型范围（all=该平台全部机型；custom=只编 devices 里的）'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'custom'
      devices:
        description: '自定义机型（mode=custom 时生效，空格/逗号分隔）'
        required: false
        default: ''
      exclude:
        description: '排除机型（空格分隔）'
        required: false
        default: ''
      chunk:
        description: '每个 subtarget 机型上限（0=不切片；大平台会切成多个并行 job）'
        required: false
        default: '60'
      packages:
        description: '额外固件包（空格分隔，默认已含 luci + vantage 主题）'
        required: false
        default: 'luci'
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: xwrt-kirkwood-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 编译本仓库（x-wrt 是完整源码树，不是 ipk 源）
  SRC_REF: master

jobs:
  # ============================================================
  # Job 1：解析本平台机型清单（权威符号来自 make prepare-tmpinfo 的元数据）
  # ============================================================
  prepare:
    name: 🧭 解析 kirkwood 机型
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      src_sha: ${{ steps.srcver.outputs.sha }}
    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ env.SRC_REF }}

      - name: 记录源码版本
        id: srcver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 生成本平台目标元数据
        run: |
          set -o pipefail
          # prepare-tmpinfo 只扫 target/package 的 Kconfig 元数据，不需要交叉工具链
          if ! make -j1 prepare-tmpinfo > prepare-tmpinfo.log 2>&1; then
            echo "::warning::prepare-tmpinfo 失败，将回退到静态解析 image/*.mk"
            tail -30 prepare-tmpinfo.log || true
          fi
          if [ -f tmp/.config-target.in ]; then
            echo "✔ tmp/.config-target.in 已生成：$(wc -l < tmp/.config-target.in) 行"
            echo "机型符号数: $(grep -c 'menuconfig TARGET_DEVICE_' tmp/.config-target.in || true)"
          else
            echo "::warning::tmp/.config-target.in 不存在，改用静态解析"
          fi

      - name: 解析并生成编译矩阵
        id: plan
        env:
          TARGET: kirkwood
          MODE: ${{ inputs.mode || 'all' }}
          CUSTOM: ${{ inputs.devices || '' }}
          EXCLUDE: ${{ inputs.exclude || '' }}
          CHUNK: ${{ inputs.chunk || '60' }}
        run: |
          cat > /tmp/plan.py <<'PY'
          import os, re, json, glob, sys

          TARGET = os.environ["TARGET"]
          exclude = set(x for x in re.split(r"[\s,]+", os.environ.get("EXCLUDE", "").strip()) if x)
          mode = (os.environ.get("MODE", "all") or "all").strip()
          chunk = int((os.environ.get("CHUNK", "60") or "60").strip() or 60)
          custom = [x for x in re.split(r"[\s,]+", os.environ.get("CUSTOM", "").strip()) if x]
          pre = TARGET + "_"

          def parse_mk(path):
              txt = open(path, encoding="utf-8", errors="replace").read()
              blocks, cur, buf = {}, None, []
              for line in txt.splitlines():
                  m = re.match(r"\s*define\s+Device/([A-Za-z0-9_.\-]+)\s*$", line)
                  if m:
                      cur, buf = m.group(1), []
                      continue
                  if cur and re.match(r"\s*endef\s*$", line):
                      blocks[cur] = buf
                      cur = None
                      continue
                  if cur is not None:
                      buf.append(line)
              regs = {}
              for line in txt.splitlines():
                  if "TARGET_DEVICES" in line and "+=" in line:
                      for tok in re.split(r"[\s\\]+", line.split("+=", 1)[1]):
                          tok = tok.strip()
                          if tok and re.fullmatch(r"[A-Za-z0-9_.\-]+", tok):
                              regs[tok] = True
              def resolve(n, depth=0, seen=None):
                  seen = seen or set()
                  if n in seen or depth > 8 or n not in blocks:
                      return ""
                  seen.add(n)
                  dts = parent = ""
                  for line in blocks[n]:
                      mm = re.search(r"DEVICE_DTS\s*:?=\s*\"?([A-Za-z0-9_./\-]+)\"?", line)
                      if mm and not dts: dts = mm.group(1)
                      mp = re.search(r"\$\(call\s+Device/([A-Za-z0-9_.\-]+)\)", line)
                      if mp and not parent: parent = mp.group(1)
                  if not dts and parent: dts = resolve(parent, depth + 1, seen)
                  return dts
              return {d: resolve(d) for d in regs}

          dts_map = {}
          for p in glob.glob("target/linux/%s/image/*.mk" % TARGET):
              for k, v in parse_mk(p).items():
                  dts_map.setdefault(k, v)

          # subtarget 列表：优先从 target Makefile 的 SUBTARGETS:= 读取
          subs = []
          mk = "target/linux/%s/Makefile" % TARGET
          if os.path.exists(mk):
              m = re.search(r"^SUBTARGETS\s*:?=\s*(.+)$", open(mk, errors="replace").read(), re.M)
              if m:
                  subs = [s for s in m.group(1).split() if s]
          if not subs:
              subs = ["generic"]

          # 1) 权威：prepare-tmpinfo 生成的机型符号
          def symbols_from_meta():
              out = []
              meta = "tmp/.config-target.in"
              if not os.path.exists(meta): return out
              txt = open(meta, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"^\s*menuconfig\s+TARGET_DEVICE_(\S+)\s*$", txt, re.M):
                  sym = m.group(1)
                  if not sym.startswith(pre) or "_DEVICE_" not in sym:
                      continue
                  conf = sym[len(pre):].rsplit("_DEVICE_", 1)[0]
                  dev = sym.rsplit("_DEVICE_", 1)[1]
                  out.append((pre + conf, dev))
              return out

          # 2) 静态回退：每个 subtarget 的 image/<sub>.mk
          def symbols_static():
              out = []
              for sub in subs:
                  p = "target/linux/%s/image/%s.mk" % (TARGET, sub)
                  if not os.path.exists(p): continue
                  for dev in parse_mk(p):
                      out.append((pre + sub, dev))
              return out

          pairs = symbols_from_meta()
          if not pairs:
              print("::warning::元数据无本平台符号，改用静态解析 image/*.mk")
              pairs = symbols_static()
          # 去重
          seen = set(); uniq = []
          for c, d in pairs:
              if (c, d) not in seen:
                  seen.add((c, d)); uniq.append((c, d))
          pairs = uniq
          print("本平台机型符号总数: %d" % len(pairs))

          # 只保留本平台
          pairs = [(c, d) for c, d in pairs if c.startswith(pre)]
          known = {d for _, d in pairs}

          if mode == "custom":
              want = set(x for x in custom if x in known)
              lost = [x for x in custom if x not in known]
              if lost:
                  print("::warning::这些机型在本平台不存在，已忽略: %s" % " ".join(sorted(set(lost))))
              pairs = [(c, d) for c, d in pairs if d in want]

          by_conf = {}
          for conf, dev in pairs:
              if dev in exclude: continue
              by_conf.setdefault(conf, []).append(dev)

          if not by_conf:
              print("::error::本平台没有解析到任何机型，检查 mode/exclude/devices 参数")
              sys.exit(1)

          os.makedirs("plan", exist_ok=True)
          matrix, rows, total = [], [], 0
          for conf in sorted(by_conf):
              devs = sorted(by_conf[conf])
              sub = conf[len(pre):] if conf.startswith(pre) else "generic"
              pieces = [devs] if chunk <= 0 else [devs[i:i + chunk] for i in range(0, len(devs), chunk)]
              for idx, piece in enumerate(pieces, 1):
                  label = sub if len(pieces) == 1 else "%s (%d/%d)" % (sub, idx, len(pieces))
                  fname = "%s-%s-%d.txt" % (TARGET, sub, idx)
                  with open(os.path.join("plan", fname), "w") as f:
                      f.write("\n".join(piece) + "\n")
                  matrix.append({
                      "label": label,
                      "target": TARGET,
                      "sub": sub,
                      "conf": conf,
                      "file": fname,
                      "count": len(piece),
                  })
                  total += len(piece)
                  rows.append((label, conf, len(piece), piece))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps(matrix, separators=(",", ":")))
              f.write("total=%d\n" % total)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧭 kirkwood 平台机型清单\n\n")
              f.write("| 子目标 | 台数 | 机型 |\n|---|---|---|\n")
              for label, conf, n, devs in rows:
                  show = "<br>".join(devs[:12]) + ("<br>…" if len(devs) > 12 else "")
                  f.write("| %s | %d | %s |\n" % (label, n, show))
              f.write("\n合计 **%d** 台机型，%d 个并行编译 job\n" % (total, len(matrix)))
          print("合计 %d 台，%d 个 job" % (total, len(matrix)))
          for m in matrix:
              print("  - %-24s %4d 台  %s" % (m["label"], m["count"], m["file"]))
          PY
          python3 /tmp/plan.py

      - name: 上传清单
        uses: actions/upload-artifact@v4
        with:
          name: device-plan-kirkwood
          path: plan/
          retention-days: 3

  # ============================================================
  # Job 2：矩阵编译（一个 job = 一个 subtarget 的一批机型）
  # ============================================================
  build:
    name: 🏗️ kirkwood/${{ matrix.label }} (${{ matrix.count }} 台)
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ env.SRC_REF }}

      - name: 释放磁盘空间（腾出更多编译容量）
        run: |
          echo "===== 释放前 ====="; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd /usr/local/share/chromium \
                      /opt/microsoft /usr/share/sbt 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="; df -h / | tail -1
          avail=$(df -m / | awk 'NR==2 {print $4}')
          echo "可用空间: ${avail} MB"
          if [ "${avail:-0}" -lt 20000 ]; then
            echo "::warning::可用空间不足 20GB，大机型批量编译可能中途写满磁盘"
          fi

      - name: 安装编译依赖
        run: |
          apt_get() { for i in 1 2 3; do sudo apt-get -o Acquire::Retries=5 update -qq && return 0; echo "apt update 失败，第 $i 次重试"; sleep 15; done; return 1; }
          apt_install() { for i in 1 2 3; do sudo apt-get -o Acquire::Retries=5 install -y -qq "$@" && return 0; echo "apt 安装失败，第 $i 次重试"; apt_get || true; sleep 20; done; return 1; }
          apt_get
          apt_install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          apt_install perl libthread-queue-any-perl 2>/dev/null || true

      - name: 下载机型清单
        uses: actions/download-artifact@v4
        with:
          name: device-plan-kirkwood
          path: plan

      - name: 恢复 ccache（加速二次编译）
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-xwrt-kirkwood-${{ matrix.conf }}-${{ matrix.file }}-${{ github.sha }}
          restore-keys: |
            ccache-xwrt-kirkwood-${{ matrix.conf }}-${{ matrix.file }}-
            ccache-xwrt-kirkwood-${{ matrix.conf }}-
            ccache-xwrt-kirkwood-
            ccache-

      - name: ccache 预热配置
        run: |
          ccache --version | head -1
          ccache -M 6G
          ccache -z
          echo "CCACHE_DIR=$PWD/.ccache"

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      # ---- 主题：应用 vantage、默认展开菜单文字、去掉 x-wrt 默认主题 bootstrap ----
      - name: 注入 vantage 主题并去掉 x-wrt 默认主题
        run: |
          set -e
          # 1) 拉取 kiddin9 的 vantage 主题与配套 app（external package）
          if [ ! -f package/luci-theme-vantage/Makefile ]; then
            git clone -q --depth 1 --filter=blob:none --sparse \
              https://github.com/kiddin9/op-packages.git /tmp/kiddin9
            (cd /tmp/kiddin9 && git sparse-checkout set luci-theme-vantage luci-app-vantage)
            cp -a /tmp/kiddin9/luci-theme-vantage /tmp/kiddin9/luci-app-vantage package/
          fi
          test -f package/luci-theme-vantage/Makefile || { echo "::error::vantage 主题包缺失"; exit 1; }
          # 30_luci-theme-vantage 首启脚本会把 mediaurlbase 指向 /luci-static/vantage，
          # 主题 header.ut 里 vantage.rail 默认 pinned —— 菜单文字默认展开，无需额外补丁
          echo "✔ vantage 主题就绪（菜单文字默认展开）"

          # 2) 先删掉 x-wrt 默认主题 bootstrap（及其配置 app）和 argon 残留
          rm -rf feeds/luci/themes/luci-theme-bootstrap \
                 feeds/luci/applications/luci-app-argon-config \
                 feeds/luci/themes/luci-theme-argon 2>/dev/null || true

          # 3) 关键：luci / luci-light 集合的 apk 元数据里硬依赖 luci-theme-bootstrap，
          #    直接删包会让 package/install 阶段 apk 报
          #    "luci-theme-bootstrap (no such package) required by luci-light" 而全平台失败。
          #    先把 feeds 里所有对这些主题的“依赖引用”改写成 vantage（依赖由 vantage 满足），
          #    这样既去掉了 bootstrap，又不破坏 luci 集合的依赖解析。
          find feeds/luci -type f \( -name 'Makefile' -o -name '*.mk' \) -print0 2>/dev/null \
            | xargs -0 -r sed -i \
                -e 's/luci-theme-bootstrap/luci-theme-vantage/g' \
                -e 's/luci-theme-argon/luci-theme-vantage/g' \
                -e 's/luci-app-argon-config/luci-app-vantage/g'
          # 清掉 feeds 索引里可能残留的空目录，避免 defconfig 仍看到 bootstrap/argon 符号
          find feeds/luci -type d \( -name 'luci-theme-bootstrap' -o -name 'luci-theme-argon' -o -name 'luci-app-argon-config' \) -prune -exec rm -rf {} + 2>/dev/null || true
          echo "✔ 已移除 bootstrap/argon 主题，依赖已改指向 vantage（避免 apk 悬空依赖）"

      - name: 生成 .config（本平台机型 + vantage 主题 + 自动规避 Kconfig 递归依赖）
        env:
          CONF: ${{ matrix.conf }}
          TARGET: ${{ matrix.target }}
          DEVICE_FILE: plan/${{ matrix.file }}
          PACKAGES: ${{ inputs.packages || 'luci' }}
          PROTECTED: luci luci-base luci-compat base-files busybox
        run: |
          cat > gen_config.py <<'PY'
          import os, re, sys

          conf = os.environ["CONF"]
          target = os.environ["TARGET"]
          want = [l.strip() for l in open(os.environ["DEVICE_FILE"]) if l.strip()]
          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]

          lines = [
              "CONFIG_TARGET_%s=y" % target,
              "CONFIG_TARGET_%s=y" % conf,
              # 多机型必须显式打开 MULTI_PROFILE，否则 Target Devices 菜单不可见、机型全被丢弃
              "CONFIG_TARGET_MULTI_PROFILE=y",
              "# CONFIG_TARGET_ALL_PROFILES is not set",
              "CONFIG_TARGET_PER_DEVICE_ROOTFS=y",
              "CONFIG_DEVEL=y",
              "CONFIG_CCACHE=y",
          ]
          lines += ["CONFIG_TARGET_DEVICE_%s_DEVICE_%s=y" % (conf, d) for d in want]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]
          # ---- 主题：vantage 设为默认，显式关掉 x-wrt 默认主题 bootstrap/argon ----
          lines += [
              "CONFIG_PACKAGE_luci-theme-vantage=y",
              "CONFIG_PACKAGE_luci-app-vantage=y",
              "# CONFIG_PACKAGE_luci-theme-bootstrap is not set",
              "# CONFIG_PACKAGE_luci-theme-argon is not set",
              "# CONFIG_PACKAGE_luci-app-argon-config is not set",
          ]
          # 中文界面
          lines += ["CONFIG_LUCI_LANG_zh_Hans=y", "CONFIG_LUCI_LANG_en=y"]

          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.txt", "w").write("\n".join(want) + "\n")
          print("已写入 %d 台机型 + %d 个额外包（%s）" % (len(want), len(pkgs), conf))
          PY

          cat > verify_config.py <<'PY'
          import os, re, sys

          conf = os.environ["CONF"]
          want = [l.strip() for l in open("wanted.txt") if l.strip()]
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          pref = "CONFIG_TARGET_DEVICE_%s_DEVICE_" % conf
          got = set(re.findall(r"^" + re.escape(pref) + r"(\S+)=y$", cfg, re.M))
          lost = [w for w in want if w not in got]
          print("预期 %d 台，实际选中 %d 台" % (len(want), len(got)))
          if lost:
              head = " ".join(lost[:15]) + (" ..." if len(lost) > 15 else "")
              print("::warning::被 kconfig 丢弃 %d 台: %s" % (len(lost), head))
          if not got:
              mp = [l.strip() for l in cfg.splitlines() if "MULTI_PROFILE" in l]
              print("::error::一台机型都没选中，MULTI_PROFILE 状态: %s" % (mp or "（.config 里没有该符号）"))
              sys.exit(1)
          # 主题断言：vantage 必须选中，bootstrap 必须关闭
          for flag in ("CONFIG_PACKAGE_luci-theme-vantage=y", "CONFIG_PACKAGE_luci-app-vantage=y"):
              print(("OK   " if flag in cfg else "WARN ") + flag)
          if "CONFIG_PACKAGE_luci-theme-bootstrap=y" in cfg:
              print("::error::x-wrt 默认主题 bootstrap 仍被选中，主题替换失败")
              sys.exit(1)
          PY

          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi
            grep -E "Please install|Build dependency|Failed to build" prepare.log | head -10 || true

            python3 gen_config.py

            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            vrc=0
            python3 verify_config.py || vrc=$?
            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包，不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            echo "::error::.config 校验未通过，且 defconfig 没有递归依赖报错"
            echo "===== .config 前 25 行 =====" && head -25 .config || true
            echo "===== defconfig.log 尾部 =====" && tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done
          [ "$ok" = "1" ] || { echo "::error::3 次尝试后仍未得到有效 .config"; exit 1; }

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          echo "并发数: $(nproc)"
          df -h / | tail -1
          rc=0
          make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败，用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              echo "未提取到失败包名，对全树 -j1 V=s 复现（到失败点即停）"
              make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  target/linux)
                    echo "===== V=s 复现 target/linux（全树跑到失败点） ====="
                    make -j1 V=s 2>&1 | tee -a error.log || true ;;
                  *)
                    echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: ccache 命中统计
        if: always()
        run: |
          ccache -s || true
          df -h / | tail -1

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kirkwood-${{ matrix.conf }}-${{ strategy.job-index }}
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验并收集产物
        env:
          SUB: ${{ matrix.sub }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p out
          DIR="bin/targets/$TARGET/$SUB"
          echo "产物目录: $DIR"
          ls -la "$DIR" 2>/dev/null | head -20 || true
          find "$DIR" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.img' -o -name '*.tar' -o -name '*.bin.gz' \
               -o -name '*.elf' -o -name '*.manifest' -o -name '*.ubi' \
               -o -name '*.trx' -o -name '*.tar.gz' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          miss=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if ls out/ 2>/dev/null | grep -qF -- "$d"; then
              echo "  ✔ $d"
            else
              echo "::warning::$d 已选中但没找到产物（可能只出 initramfs 或该机型打包被跳过）"
              miss=$((miss+1))
            fi
          done < wanted.txt
          n=$(ls out 2>/dev/null | wc -l)
          echo "产物文件数: $n，缺失机型: $miss"
          if [ "$n" -eq 0 ]; then
            echo "::error::没有收集到任何产物"
            exit 1
          fi

          {
            echo "## 🏗️ kirkwood/${{ matrix.label }} 编译完成"
            echo ""
            echo "- target/子目标: \`$TARGET/$SUB\`"
            echo "- 机型: ${{ matrix.count }} 台，产物文件: $n 个，缺失: $miss 台"
            echo "- 主题: vantage（菜单文字默认展开，已移除 x-wrt bootstrap 主题）"
            echo ""
            echo "| 机型 | 产物 |"
            echo "|---|---|"
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              f=$(ls out 2>/dev/null | grep -F -- "$d" | head -6 | tr '\n' '<br>')
              echo "| $d | ${f:-—} |"
            done < wanted.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-kirkwood-${{ matrix.conf }}-${{ strategy.job-index }}
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布 Release（只新增，不覆盖历史 release）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: images-kirkwood-*
          path: rel
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh | head -30
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "文件总数: $(ls -1 | wc -l)"

      - name: 创建 Release（xwrt-kirkwood-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="xwrt-kirkwood-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          X-Wrt 自动编译 · kirkwood 平台（Marvell Kirkwood）

          - 触发方式: ${{ github.event_name }}
          - 提交: ${{ needs.prepare.outputs.src_sha }}
          - 机型数: ${{ needs.prepare.outputs.total }} 台
          - 平台: kirkwood
          - 主题: vantage（菜单文字默认展开；已移除 x-wrt 默认主题 bootstrap）
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          每个机型均有独立的 squashfs-sysupgrade 产物。刷机前务必核对机型名与分区布局（-stock / -ubootmod 等变体不可混刷）。
          EOF
          [ -n "$(ls -A rel 2>/dev/null)" ] || { echo "::warning::没有任何产物可发布，跳过发布"; exit 0; }
          gh release create "$TAG" rel/* \
            --title "X-Wrt kirkwood 平台 · $TAG" \
            --notes-file notes.md \
            --latest

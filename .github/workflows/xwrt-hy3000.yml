name: 🧱 X-Wrt Philips HY3000 固件编译

# 每周六 09:00（北京时间 UTC+8）自动编译
# GitHub 的 cron 使用 UTC：周六 01:00 UTC = 周六 09:00 北京时间
# 单机型 workflow：只编译 philips_hy3000（MT7981B + MT7531 + eMMC）
# 主题：luci-theme-vantage 为默认主题，argon 主题已移除
# WiFi：机型适配里固定 &wifi（eMMC factory eeprom 校准）+ 首启脚本强制开启双频，
#       避免出现「网络菜单里没有 WiFi 选项」的情况
on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      ref:
        description: '编译的分支/提交（默认 master）'
        required: false
        default: 'master'
      packages:
        description: '额外固件包（空格分隔，可留空）'
        required: false
        default: ''
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean
      use_ccache:
        description: '是否使用 ccache 加速（首次编译会更慢）'
        required: false
        default: true
        type: boolean

concurrency:
  group: xwrt-hy3000-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: philips_hy3000
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G

jobs:
  # ============================================================
  # 单机型编译：mediatek/filogic + Philips HY3000
  # ============================================================
  build:
    name: 🏗️ HY3000（mediatek/filogic）
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      src_sha: ${{ steps.srcver.outputs.sha }}

    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 1

      - name: 记录源码版本
        id: srcver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd /usr/local/share/chromium \
                      /opt/microsoft /usr/share/sbt 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          echo "===== 释放后 ====="; df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 恢复 ccache
        if: ${{ inputs.use_ccache != false }}
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-xwrt-hy3000-${{ steps.srcver.outputs.sha }}
          restore-keys: |
            ccache-xwrt-hy3000-
            ccache-xwrt-mediatek-

      - name: ccache 预热配置
        if: ${{ inputs.use_ccache != false }}
        run: |
          ccache --version | head -1
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: 机型适配自检（DTS / 设备块 / 网络与升级 / WiFi 脚本）
        run: |
          set -e
          echo "== 机型适配文件自检 =="
          test -f target/linux/mediatek/dts/mt7981b-philips-hy3000.dts || { echo "::error::缺少 hy3000 设备树"; exit 1; }
          grep -q 'define Device/philips_hy3000' target/linux/mediatek/image/filogic.mk || { echo "::error::filogic.mk 缺少 philips_hy3000 设备块"; exit 1; }
          grep -q 'philips,hy3000' target/linux/mediatek/filogic/base-files/etc/board.d/02_network || { echo "::error::02_network 未登记 hy3000"; exit 1; }
          grep -q 'philips,hy3000' target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh || { echo "::error::platform.sh 未登记 hy3000"; exit 1; }
          # WiFi 关键点：&wifi 必须开启并绑定 eMMC factory eeprom
          grep -q '&wifi' target/linux/mediatek/dts/mt7981b-philips-hy3000.dts || { echo "::error::设备树未启用 &wifi"; exit 1; }
          grep -q 'eeprom_factory_0' target/linux/mediatek/dts/mt7981b-philips-hy3000.dts || { echo "::error::设备树未绑定 WiFi 校准 eeprom"; exit 1; }
          test -f target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-hy3000-wifi || { echo "::error::缺少 WiFi 首启脚本"; exit 1; }
          grep -q 'wifi config' target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-hy3000-wifi || { echo "::error::WiFi 首启脚本未生成 wireless 配置"; exit 1; }
          echo "✔ 机型适配自检通过"

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      # ---- 默认主题：vantage；argon 主题及其配置 app 彻底移除 ----
      - name: 注入 vantage 主题并移除 argon / bootstrap
        run: |
          set -e
          rm -rf /tmp/kiddin9
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/kiddin9/op-packages.git /tmp/kiddin9
          (cd /tmp/kiddin9 && git sparse-checkout set luci-theme-vantage luci-app-vantage)
          cp -a /tmp/kiddin9/luci-theme-vantage /tmp/kiddin9/luci-app-vantage package/
          test -f package/luci-theme-vantage/Makefile || { echo "::error::vantage 主题包缺失"; exit 1; }
          echo "✔ vantage 主题已加入 package/"

          rm -rf feeds/luci/themes/luci-theme-argon \
                 feeds/luci/applications/luci-app-argon-config \
                 feeds/luci/themes/luci-theme-bootstrap 2>/dev/null || true

          find feeds/luci -type f \( -name 'Makefile' -o -name '*.mk' \) -print0 2>/dev/null \
            | xargs -0 -r sed -i \
                -e 's/luci-theme-bootstrap/luci-theme-vantage/g' \
                -e 's/luci-theme-argon/luci-theme-vantage/g' \
                -e 's/luci-app-argon-config/luci-app-vantage/g'
          find feeds/luci -type d \( -name 'luci-theme-bootstrap' -o -name 'luci-theme-argon' -o -name 'luci-app-argon-config' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          echo "✔ 已移除 argon / bootstrap，依赖已改指向 vantage"

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-default-theme-vantage <<'EOF'
          #!/bin/sh
          uci -q get luci.main >/dev/null 2>&1 || uci set luci.main=core
          uci set luci.main.mediaurlbase='/luci-static/vantage'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-default-theme-vantage
          echo "✔ 默认主题已锁定为 luci-theme-vantage"

      - name: 生成 .config（HY3000 + vantage 主题 + WiFi 组件）
        env:
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -e
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          # 机型选择必须走 MULTI_PROFILE + 单机型符号；直接写 TARGET_PROFILE 会被 kconfig 丢弃
          CONFIG_TARGET_MULTI_PROFILE=y
          # CONFIG_TARGET_ALL_PROFILES is not set
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          # ---- 主题：vantage 为默认，argon / bootstrap 关闭 ----
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-vantage=y
          # CONFIG_PACKAGE_luci-theme-argon is not set
          # CONFIG_PACKAGE_luci-app-argon-config is not set
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          # ---- WiFi：完整 wpad（含 802.11k/v/r）+ 无线驱动 + 监管数据库 ----
          CONFIG_PACKAGE_wpad-wolfssl=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7981-firmware=y
          CONFIG_PACKAGE_mt7981-wo-firmware=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_luci-mod-network=y
          # ---- 中文界面 ----
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_en=y
          # ---- 常用组件（eMMC 机型：块设备与文件系统工具）----
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-mtd-rw=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_mkf2fs=y
          CONFIG_PACKAGE_f2fsck=y
          EOF
          if [ -n "$PACKAGES" ]; then
            for p in $PACKAGES; do echo "CONFIG_PACKAGE_$p=y" >> .config; done
          fi

          make -j1 defconfig > defconfig.log 2>&1 || { tail -40 defconfig.log; echo "::error::make defconfig 失败"; exit 1; }

          echo "===== 关键配置校验 ====="
          grep -E 'CONFIG_TARGET_PROFILE|CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000|CONFIG_PACKAGE_luci-theme-vantage|CONFIG_PACKAGE_luci-theme-argon|CONFIG_PACKAGE_wpad-wolfssl|CONFIG_PACKAGE_kmod-mt7915e|CONFIG_PACKAGE_wireless-regdb' .config || true

          fail=0
          grep -q 'CONFIG_TARGET_PROFILE="DEVICE_philips_hy3000"' .config || { echo "::error::目标机型未选中 philips_hy3000"; fail=1; }
          grep -q 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y' .config || { echo "::error::HY3000 机型符号未启用"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-vantage=y' .config || { echo "::error::默认主题 vantage 未选中"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-argon=y' .config && { echo "::error::argon 主题仍然存在"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-app-argon-config=y' .config && { echo "::error::argon 配置 app 仍然存在"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-bootstrap=y' .config && { echo "::error::bootstrap 主题仍被选中"; fail=1; }
          grep -q 'CONFIG_PACKAGE_wpad-wolfssl=y' .config || { echo "::error::缺少 wpad，会导致没有 WiFi 功能"; fail=1; }
          grep -q 'CONFIG_PACKAGE_kmod-mt7915e=y' .config || { echo "::error::缺少 MT7915E 无线驱动"; fail=1; }
          grep -q 'CONFIG_PACKAGE_wireless-regdb=y' .config || { echo "::error::缺少 wireless-regdb"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "✔ .config 校验通过（含 WiFi 组件）"

      - name: 预下载软件包
        run: make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          echo "并发数: $(nproc)"
          df -h / | tail -1
          rc=0
          make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败，用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  package/*) echo "===== V=s 复现 $p ====="; make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *) echo "===== V=s 复现 target ====="; make -j1 V=s 2>&1 | tee -a error.log || true ;;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行 ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: ccache 命中统计
        if: always()
        run: |
          ccache -s || true
          df -h / | tail -1

      - name: 失败诊断
        if: failure()
        run: |
          for f in defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-hy3000
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验并收集产物（含 WiFi 落地自检）
        run: |
          set -e
          mkdir -p out
          DIR="bin/targets/$TARGET/$SUBTARGET"
          echo "产物目录: $DIR"
          ls -la "$DIR" 2>/dev/null | head -20 || true
          find "$DIR" -maxdepth 1 -type f \
            \( -name '*hy3000*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out || true
          if ! ls out/*hy3000*sysupgrade.bin >/dev/null 2>&1; then
            echo "::error::未找到 HY3000 的 sysupgrade 产物"
            exit 1
          fi

          echo "===== WiFi 落地自检（rootfs 内的配置与脚本）====="
          ROOTDIR=$(find build_dir -maxdepth 1 -type d -name 'target-*' | head -1)/root-mediatek
          if [ -d "$ROOTDIR" ]; then
            ls "$ROOTDIR/etc/uci-defaults/" 2>/dev/null | grep -E 'hy3000-wifi|default-theme-vantage' || true
            test -f "$ROOTDIR/etc/uci-defaults/99-hy3000-wifi" || { echo "::error::rootfs 内缺少 WiFi 首启脚本"; exit 1; }
            test -d "$ROOTDIR/lib/modules" && find "$ROOTDIR/lib/modules" -name 'mt7915e.ko*' | head -3 || true
            if find "$ROOTDIR/lib/modules" -name 'mt7915e.ko*' | grep -q .; then
              echo "✔ rootfs 内含 mt7915e 无线驱动"
            else
              echo "::warning::rootfs 内未找到 mt7915e.ko（若为内建编译则属正常）"
            fi
            test -d "$ROOTDIR/lib/firmware/mediatek" && ls "$ROOTDIR/lib/firmware/mediatek" | grep -i 'mt7981\|mt7915' | head -5 || true
          else
            echo "::warning::未找到 root-mediatek 目录，跳过 rootfs 自检"
          fi

          (cd out && sha256sum * > sha256sums.txt)
          {
            echo "## 🧱 Philips HY3000 编译完成"
            echo ""
            echo "- 机型: \`philips_hy3000\`（MT7981B + MT7531 + eMMC）"
            echo "- 源码: ${{ steps.srcver.outputs.sha }}"
            echo "- 主题: luci-theme-vantage（默认，已移除 argon / bootstrap）"
            echo "- WiFi: 完整 wpad + mt7915e，首启脚本强制开启双频并设国家码 CN"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -l out | awk 'NR>1 {printf "| %s | %s |\n", $9, $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-hy3000
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 发布 Release（定时任务自动发布，手动运行按 make_release 开关）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: build
    if: |
      github.event_name == 'schedule' || inputs.make_release
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-hy3000
          path: rel

      - name: 创建 Release（xwrt-hy3000-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd rel
          ls -lh
          TAG="xwrt-hy3000-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          X-Wrt 自动编译 · Philips HY3000

          - 触发方式: ${{ github.event_name }}
          - 提交: ${{ needs.build.outputs.src_sha }}
          - 机型: philips_hy3000（MT7981B + MT7531 + eMMC）
          - 主题: luci-theme-vantage（默认；已移除 argon / bootstrap）
          - WiFi: 完整 wpad + MT7915E 驱动，首启脚本开启双频（国家码 CN、802.11k/v）
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          sysupgrade 为 sysupgrade-tar 格式，适用于 HY3000（eMMC，内核 FIT + 独立 rootfs 分区）。
          EOF
          gh release create "$TAG" ./* \
            --title "X-Wrt HY3000 · $TAG" \
            --notes-file notes.md \
            --latest
name: 📦 把已有运行的产物发布为 Release

# 用途：某次编译已成功、产物已在 Actions 里（run 页面的 Artifacts），但没有发 Release 时，
# 不用重新编译，直接把那次运行的产物打包发布成 Release。
#
# 用法：Actions → 本 workflow → Run workflow，填入目标运行的 run_id
#   run_id 取运行页面 URL 里的数字，例如
#   https://github.com/s9xxx/xwrt/actions/runs/44439392659 → 44439392659
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '要发布的 Actions 运行 ID（运行 URL 里的数字）'
        required: true
        type: string
      tag:
        description: 'Release tag（留空自动用 xwrt-run-<run_id>）'
        required: false
        default: ''
        type: string
      title:
        description: 'Release 标题（留空自动生成）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否标记为 Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 📦 发布运行 ${{ inputs.run_id }} 的产物
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 下载该运行的产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -e
          echo "来源运行: $RUN_ID"
          gh run view "$RUN_ID" --json conclusion,headSha,displayTitle,event || true
          gh run download "$RUN_ID" -D dl
          echo "===== 下载到的文件 ====="
          find dl -type f | head -40

      - name: 汇总固件文件
        run: |
          set -e
          mkdir -p rel
          python3 - <<'PY2'
          import os, shutil
          src, dst = 'dl', 'rel'
          used = {}
          count = 0
          for root, _, files in os.walk(src):
            for f in sorted(files):
              if f.startswith('device-plan'):
                continue
              srcp = os.path.join(root, f)
              if not os.path.isfile(srcp):
                continue
              # 展平到 rel/，重名时用产物目录名做前缀，避免多机型/多产物互相覆盖
              name = f
              if name in used:
                prefix = os.path.basename(root).replace(os.sep, '-')
                name = f'{prefix}-{f}'
              while name in used:
                name = 'dup-' + name
              used[name] = srcp
              shutil.copy2(srcp, os.path.join(dst, name))
              count += 1
          print(f'可发布文件数: {count}')
          if count == 0:
            raise SystemExit(f'::error::运行没有可发布的产物文件（检查该 run 的 Artifacts 是否已过期）')
          PY2
          ls -lh rel
          (cd rel && sha256sum * > MANUAL-sha256sums.txt && head -40 MANUAL-sha256sums.txt)

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG_INPUT: ${{ inputs.tag }}
          TITLE_INPUT: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -e
          TAG="${TAG_INPUT:-xwrt-run-${RUN_ID}}"
          TITLE="${TITLE_INPUT:-X-Wrt 产物发布 · run ${RUN_ID}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::tag $TAG 已存在，改用 $TAG-r${GITHUB_RUN_NUMBER}"
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          FLAG=""
          if [ "$PRERELEASE" = "true" ]; then FLAG="--prerelease"; fi
          cat > notes.md <<EOF
          由已有运行产物手动发布（不重新编译，不含代码变更）。

          - 来源运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}
          - 发布作业: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 校验: 附件内 MANUAL-sha256sums.txt 为本次发布文件的校验和
          EOF
          gh release create "$TAG" rel/* \
            --title "$TITLE" \
            --notes-file notes.md \
            $FLAG \
            --latest
          echo "✔ 已发布: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
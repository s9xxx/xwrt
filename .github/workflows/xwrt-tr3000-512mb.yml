name: 🧱 X-Wrt Cudy TR3000 512MB 固件编译

# 每周六 09:00（北京时间 UTC+8）自动编译
# GitHub 的 cron 使用 UTC：周六 01:00 UTC = 周六 09:00 北京时间
# 单机型 workflow：只编译 cudy_tr3000-512mb-v1（512MB NAND 扩容版）
# 主题：luci-theme-vantage 为默认主题，argon 主题已移除
on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      ref:
        description: '编译的分支/提交（默认 master）'
        required: false
        default: 'master'
      packages:
        description: '额外固件包（空格分隔，可留空）'
        required: false
        default: ''
      make_release:
        description: '是否发布到 Release'
        required: false
        default: true
        type: boolean
      use_ccache:
        description: '是否使用 ccache 加速（首次编译会更慢）'
        required: false
        default: true
        type: boolean

concurrency:
  group: xwrt-tr3000-512mb-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: cudy_tr3000-512mb-v1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G

jobs:
  # ============================================================
  # 单机型编译：mediatek/filogic + Cudy TR3000 512MB NAND
  # ============================================================
  build:
    name: 🏗️ TR3000 512MB（mediatek/filogic）
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      src_sha: ${{ steps.srcver.outputs.sha }}

    steps:
      - name: Checkout 源码（本仓库）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 1

      - name: 记录源码版本
        id: srcver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd /usr/local/share/chromium \
                      /opt/microsoft /usr/share/sbt 2>/dev/null || true
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          echo "===== 释放后 ====="; df -h / | tail -1

      - name: 安装编译依赖
        run: |
          apt_get() { for i in 1 2 3; do sudo apt-get -o Acquire::Retries=5 update -qq && return 0; echo "apt update 失败，第 $i 次重试"; sleep 15; done; return 1; }
          apt_install() { for i in 1 2 3; do sudo apt-get -o Acquire::Retries=5 install -y -qq "$@" && return 0; echo "apt 安装失败，第 $i 次重试"; apt_get || true; sleep 20; done; return 1; }
          apt_get
          apt_install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          apt_install perl libthread-queue-any-perl 2>/dev/null || true

      - name: 恢复 ccache
        if: ${{ inputs.use_ccache != false }}
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-xwrt-tr3000-512mb-${{ steps.srcver.outputs.sha }}
          restore-keys: |
            ccache-xwrt-tr3000-512mb-
            ccache-xwrt-mediatek-

      - name: ccache 预热配置
        if: ${{ inputs.use_ccache != false }}
        run: |
          ccache --version | head -1
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      # ---- 默认主题：vantage；argon 主题及其配置 app 彻底移除 ----
      - name: 注入 vantage 主题并移除 argon / bootstrap
        run: |
          set -e
          # 1) 拉取 kiddin9 的 vantage 主题与配套 app
          rm -rf /tmp/kiddin9
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/kiddin9/op-packages.git /tmp/kiddin9
          (cd /tmp/kiddin9 && git sparse-checkout set luci-theme-vantage luci-app-vantage)
          cp -a /tmp/kiddin9/luci-theme-vantage /tmp/kiddin9/luci-app-vantage package/
          test -f package/luci-theme-vantage/Makefile || { echo "::error::vantage 主题包缺失"; exit 1; }
          echo "✔ vantage 主题已加入 package/"

          # 2) 删除 argon 主题、argon 配置 app 与 x-wrt 默认主题 bootstrap 的目录
          rm -rf feeds/luci/themes/luci-theme-argon \
                 feeds/luci/applications/luci-app-argon-config \
                 feeds/luci/themes/luci-theme-bootstrap 2>/dev/null || true

          # 3) luci / luci-light 集合里硬依赖 luci-theme-bootstrap，
          #    直接删包会让 apk 安装阶段报悬空依赖，先把依赖引用改指向 vantage
          find feeds/luci -type f \( -name 'Makefile' -o -name '*.mk' \) -print0 2>/dev/null \
            | xargs -0 -r sed -i \
                -e 's/luci-theme-bootstrap/luci-theme-vantage/g' \
                -e 's/luci-theme-argon/luci-theme-vantage/g' \
                -e 's/luci-app-argon-config/luci-app-vantage/g'
          find feeds/luci -type d \( -name 'luci-theme-bootstrap' -o -name 'luci-theme-argon' -o -name 'luci-app-argon-config' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          echo "✔ 已移除 argon / bootstrap，依赖已改指向 vantage"

          # 4) 兜底：首启 UCI 脚本显式指定默认主题为 vantage
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-default-theme-vantage <<'EOF'
          #!/bin/sh
          uci -q get luci.main >/dev/null 2>&1 || uci set luci.main=core
          uci set luci.main.mediaurlbase='/luci-static/vantage'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-default-theme-vantage
          echo "✔ 默认主题已锁定为 luci-theme-vantage"

      - name: 生成 .config（TR3000 512MB + vantage 主题）
        env:
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -e
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          # 单机型：直接选 choice 成员（不带 DEVICE_ 前缀），TARGET_PROFILE 由 kconfig 自动推导
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512mb-v1=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=160
          CONFIG_TARGET_UBIFS_FREE_SPACE_FIXUP=y
          # ---- 主题：vantage 为默认，argon / bootstrap 关闭 ----
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-vantage=y
          # CONFIG_PACKAGE_luci-theme-argon is not set
          # CONFIG_PACKAGE_luci-app-argon-config is not set
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          # ---- 中文界面 ----
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_en=y
          # ---- 常用组件（与源仓库 512M 版本保持一致的轻量集合）----
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-mtd-rw=y
          CONFIG_PACKAGE_block-mount=y
          EOF
          if [ -n "$PACKAGES" ]; then
            for p in $PACKAGES; do echo "CONFIG_PACKAGE_$p=y" >> .config; done
          fi

          make -j1 defconfig > defconfig.log 2>&1 || { tail -40 defconfig.log; echo "::error::make defconfig 失败"; exit 1; }

          echo "===== 关键配置校验 ====="
          grep -E 'CONFIG_TARGET_PROFILE|CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512mb-v1|CONFIG_PACKAGE_luci-theme-vantage|CONFIG_PACKAGE_luci-theme-argon|CONFIG_PACKAGE_luci-app-argon-config|CONFIG_PACKAGE_luci-theme-bootstrap' .config || true

          fail=0
          grep -q 'CONFIG_TARGET_PROFILE="DEVICE_cudy_tr3000-512mb-v1"' .config || { echo "::error::目标机型未选中 cudy_tr3000-512mb-v1"; fail=1; }
          grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512mb-v1=y' .config || { echo "::error::512MB 机型符号未启用"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-vantage=y' .config || { echo "::error::默认主题 vantage 未选中"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-argon=y' .config && { echo "::error::argon 主题仍然存在"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-app-argon-config=y' .config && { echo "::error::argon 配置 app 仍然存在"; fail=1; }
          grep -q 'CONFIG_PACKAGE_luci-theme-bootstrap=y' .config && { echo "::error::bootstrap 主题仍被选中"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "✔ .config 校验通过"

      - name: 预下载软件包
        run: make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          echo "并发数: $(nproc)"
          df -h / | tail -1
          rc=0
          make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败，用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              make VERSION_DIST="xwrt-$(date +%Y%m%d)" -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  package/*) echo "===== V=s 复现 $p ====="; make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *) echo "===== V=s 复现 target ====="; make -j1 V=s 2>&1 | tee -a error.log || true ;;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行 ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: ccache 命中统计
        if: always()
        run: |
          ccache -s || true
          df -h / | tail -1

      - name: 失败诊断
        if: failure()
        run: |
          for f in defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-tr3000-512mb
          path: |
            *.log
            .config
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: 校验并收集产物
        run: |
          set -e
          mkdir -p out
          DIR="bin/targets/$TARGET/$SUBTARGET"
          echo "产物目录: $DIR"
          ls -la "$DIR" 2>/dev/null | head -20 || true
          find "$DIR" -maxdepth 1 -type f \
            \( -name '*tr3000*512mb*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          n=$(ls out 2>/dev/null | wc -l)
          echo "产物文件数: $n"
          ls -lh out || true
          if ! ls out/*tr3000*512mb*sysupgrade.bin >/dev/null 2>&1; then
            echo "::error::未找到 TR3000 512MB 的 sysupgrade 产物"
            exit 1
          fi
          # 产物大小必须小于 512MB NAND 的 ubi 分区（约 506MB）
          max=$((506 * 1024 * 1024))
          for f in out/*tr3000*512mb*sysupgrade.bin; do
            size=$(stat -c %s "$f")
            echo "$f 大小: $size 字节"
            if [ "$size" -ge "$max" ]; then
              echo "::error::$f 超出 512MB 闪存分区容量"
              exit 1
            fi
          done
          (cd out && sha256sum * > sha256sums.txt)
          {
            echo "## 🧱 Cudy TR3000 512MB 编译完成"
            echo ""
            echo "- 机型: \`cudy_tr3000-512mb-v1\`（mediatek/filogic，512MB NAND）"
            echo "- 源码: ${{ steps.srcver.outputs.sha }}"
            echo "- 主题: luci-theme-vantage（默认，已移除 argon / bootstrap）"
            echo "- 产物数: $n"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -l out | awk 'NR>1 {printf "| %s | %s |\n", $9, $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-tr3000-512mb
          path: out/
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # 发布 Release（定时任务自动发布，手动运行按 make_release 开关）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: build
    if: |
      always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-tr3000-512mb
          path: rel

      - name: 创建 Release（xwrt-tr3000-512mb-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd rel
          ls -lh
          TAG="xwrt-tr3000-512mb-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "REUSE_RELEASE=1" >> "$GITHUB_ENV"
          fi
          cat > notes.md <<EOF
          X-Wrt 自动编译 · Cudy TR3000 512MB NAND

          - 触发方式: ${{ github.event_name }}
          - 提交: ${{ needs.build.outputs.src_sha }}
          - 机型: cudy_tr3000-512mb-v1（mediatek/filogic，512MB 闪存）
          - 主题: luci-theme-vantage（默认；已移除 argon / bootstrap）
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          刷机前请确认设备为 512MB NAND 扩容版，切勿与 128MB / 256MB 机型混刷。
          EOF
          FILES=$(ls | grep -vx 'notes.md')
          [ -n "$FILES" ] || { echo "::warning::没有可发布的固件产物，跳过发布"; exit 0; }
          [ "$REUSE_RELEASE" = "1" ] && { gh release upload "$TAG" $FILES --clobber; echo "已更新当日 Release"; exit 0; }
          gh release create "$TAG" $FILES \
            --title "X-Wrt TR3000 512MB · $TAG" \
            --notes-file notes.md \
            --latest